name: controlplane-destroy

# Article VIII: destroy is never automatic. Manual workflow_dispatch only, gated on a typed
# confirmation matching the stack name. The destroy plan FAILS on the protected resources
# (prevent_destroy on the RG + CanNotDelete management lock) unless the protection-removal PR
# has merged first (FR-015, infra/control-plane/README.md). Destroying this stack loses the
# LIVE IPAM ledger — recorded allocations are gone; the schema re-applies from migrations.

on:
  workflow_dispatch:
    inputs:
      destroy-confirm:
        description: 'Type the stack name to confirm destroy: control-plane'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: tofu-control-plane   # shares the apply lock — no destroy during an apply
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/control-plane
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Verify typed confirmation
        if: inputs.destroy-confirm != 'control-plane'
        run: |
          echo "::error::destroy-confirm must equal 'control-plane' (got '${{ inputs.destroy-confirm }}'). Aborting."
          exit 1

      - uses: actions/checkout@v5

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: tofu init
        run: tofu init -input=false

      # Shown for the record; fails here on prevent_destroy (the RG) if protection is still
      # in place — this is the SC-007 protection drill.
      - name: tofu plan -destroy
        run: tofu plan -destroy -input=false -no-color | tee "$GITHUB_STEP_SUMMARY"

      - name: tofu destroy
        run: tofu destroy -input=false -no-color -auto-approve
