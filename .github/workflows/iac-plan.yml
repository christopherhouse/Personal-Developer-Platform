name: iac-plan

# PR rails (contracts/ci-workflows.md): fmt-check repo-wide, then validate + plan per
# stack with the plan rendered on the PR. All jobs are required status checks
# (branch-protection ruleset) — failure blocks merge (FR-010). OIDC auth, zero secrets
# (FR-012): client/tenant/subscription IDs are plain repo variables.
#
# Runs on EVERY PR (no path filter): the ruleset requires these checks to pass, and a
# path-filtered workflow would leave them permanently "pending" on non-infra PRs, which
# GitHub treats as unmet — blocking docs-only PRs forever. plan is read-only and cheap;
# on a non-infra PR it simply reports "no changes".

on:
  pull_request:

permissions:
  contents: read
  id-token: write        # OIDC token issuance for azure/login + the azurerm backend
  pull-requests: write   # sticky plan comment

concurrency:
  group: iac-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # fmt is offline and repo-wide — no cloud auth needed.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - name: tofu fmt -check (repo-wide)
        run: tofu fmt -check -recursive

  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # spec 007: control-plane-host plans its data sources (control-plane's ACA subnet + the private
        # Postgres) at plan time, so it only plans cleanly once control-plane (incl. the snet-pdp-westus3-aca
        # subnet) is already APPLIED. On first bring-up, merge the subnet (infra/control-plane) first, then
        # the host stack — see infra/control-plane-host/README.md.
        stack: [foundations, platform-dns, platform-observability, control-plane, fabric, control-plane-host]
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    env:
      # azurerm backend + provider authenticate via GitHub OIDC (research §2). The OIDC
      # token is fetched natively from ACTIONS_ID_TOKEN_REQUEST_* (id-token: write).
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      # Plain variables, not secrets (FR-012) — login still uses OIDC federation.
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: tofu init
        run: tofu init -input=false

      - name: tofu validate
        run: tofu validate -no-color

      - name: tofu plan
        id: plan
        run: tofu plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt

      - name: Render plan to job summary
        if: always()
        run: |
          {
            echo "## tofu plan — \`${{ matrix.stack }}\`"
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post plan to PR (sticky)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "<!-- iac-plan:${{ matrix.stack }} -->"
            echo "## tofu plan — \`${{ matrix.stack }}\` (\`${{ steps.plan.outcome }}\`)"
            echo '```'
            cat plan.txt
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file comment.md --edit-last --create-if-none

  # Failure hook (repo convention — see .github/actions/notify-sre-agent/README.md): on any
  # job failure, POST run context (failed jobs/steps, error annotations, log tails) to the
  # Azure SRE Agent HTTP trigger so the agent starts investigating without an owner in the
  # loop. Best-effort: it never fails this run; skipped entirely when the
  # SRE_AGENT_TRIGGER_URL repo variable is unset.
  notify-sre-agent:
    needs: [fmt, plan]
    if: ${{ failure() && vars.SRE_AGENT_TRIGGER_URL != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout (the local composite action)
      id-token: write  # azure/login OIDC → bearer token for the trigger
      actions: read    # this run's jobs + logs (failure context)
      checks: read     # per-job error annotations
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/notify-sre-agent
        with:
          trigger-url: ${{ vars.SRE_AGENT_TRIGGER_URL }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
