name: spoke-vend

# run-name carries the control plane's correlation surrogate so a dispatched run can be mapped back to
# its environment by parsing the title (spec 006, research §4): `pdp <mode> <env_id>`.
run-name: pdp ${{ inputs.mode }} ${{ inputs.env_id }}

# Vend one spoke into a target subscription (Articles I/II — OpenTofu only in dispatched CI,
# OIDC, zero stored secrets). SKELETON (T005): dispatch inputs + dual-subscription OIDC + the
# per-spoke backend-key init are wired here; the plan→apply body lands in T017.
#
# Dual-subscription auth (contracts §I3): the CI identity federates into BOTH the platform
# subscription (state account + hub-side peering + shared DNS + fabric remote state) and the
# target subscription (the spoke RG/VNet/NSGs/route/peering). The azurerm providers (versions.tf)
# pick their subscription from the target_subscription_id / platform_subscription_id vars; OIDC
# itself is per-app, not per-sub, so one federated credential authenticates both as long as the
# identity holds the roles in each (T008).
#
# State: one state per spoke at spokes/<target-sub-id>/<spoke-name>, set at init via partial
# backend config (backend.tf). A re-vend of the same (sub, name) converges — no duplicate (FR-009).

on:
  workflow_dispatch:
    inputs:
      env_id:
        description: "Control-plane correlation surrogate (env_id); echoed into run-name (spec 006)"
        required: false
        type: string
        default: ""
      mode:
        description: "plan = tofu plan only (Article VIII preview); apply = create the spoke"
        required: false
        type: choice
        default: apply
        options:
          - plan
          - apply
      region:
        description: "Azure region (must have a deployed fabric), e.g. westus3"
        required: true
        type: string
        default: westus3
      region_index:
        description: "Registered region index (2nd octet of the /16), e.g. 2 for westus3"
        required: true
        type: string
        default: "2"
      target_subscription_id:
        description: "Subscription to vend the spoke into (must be writable by the CI identity)"
        required: true
        type: string
      spoke_name:
        description: "Spoke name, unique within the target subscription ([a-z0-9-], 1–24), e.g. app1"
        required: true
        type: string
      spoke_cidr:
        description: "Spoke CIDR inside 10.<region_index>.0.0/16, outside …252.0/22, e.g. 10.2.16.0/24"
        required: true
        type: string
      subnets_json:
        description: 'Optional subnet shape as JSON map (default: single workload subnet). e.g. {"workload":{"newbits":0,"netnum":0,"delegations":[]}}'
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write          # OIDC token issuance for azure/login + the azurerm backend/providers

concurrency:
  # Per-spoke lock: serializes vend/destroy of the SAME spoke, while different spokes vend in
  # parallel. spoke-destroy uses the same group so a destroy never races a vend of that spoke.
  group: tofu-spoke-${{ inputs.spoke_name }}
  cancel-in-progress: false

jobs:
  vend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/spoke
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      # Backend subscription = the platform sub (holds the state account). Spoke target/platform
      # subs reach the providers via the TF_VAR_* below.
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Stack inputs, threaded from the dispatch (ready for plan/apply in T017).
      TF_VAR_region: ${{ inputs.region }}
      TF_VAR_region_index: ${{ inputs.region_index }}
      TF_VAR_target_subscription_id: ${{ inputs.target_subscription_id }}
      TF_VAR_spoke_name: ${{ inputs.spoke_name }}
      TF_VAR_spoke_cidr: ${{ inputs.spoke_cidr }}
    steps:
      - uses: actions/checkout@v5

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Per-spoke state key via partial backend config (backend.tf omits the key).
      - name: tofu init (per-spoke backend key)
        run: |
          tofu init -input=false -no-color \
            -backend-config="key=spokes/${{ inputs.target_subscription_id }}/${{ inputs.spoke_name }}"

      # Optional subnet shape → TF_VAR_subnets for the plan/apply body. Empty input keeps the
      # stack default (single workload subnet, variables.tf).
      - name: Stage optional subnet shape
        if: inputs.subnets_json != ''
        run: echo "TF_VAR_subnets=${{ inputs.subnets_json }}" >> "$GITHUB_ENV"

      # Two-phase dispatch (spec 006, Article VIII): the control plane runs `mode=plan` first to surface
      # the plan, then `mode=apply` after confirmation. All stack inputs flow from the TF_VAR_* env
      # above; a re-vend of the same (sub, name) converges — no duplicate (FR-009). The dual-subscription
      # providers (versions.tf) pick their sub from the vars; the one OIDC login authenticates both.
      - name: tofu plan
        run: |
          tofu plan -input=false -no-color -out=tfplan | tee plan.txt
          { echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # On a plan run, publish the plan as a durable artifact the control plane downloads into the
      # environment's PlanSummary for confirmation (contracts/dispatch-and-tracking.md §6); never apply.
      - name: tofu show (structured plan)
        if: inputs.mode == 'plan'
        run: tofu show -no-color -json tfplan > plan.json

      - name: Upload plan artifact
        if: inputs.mode == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ inputs.env_id }}
          path: |
            infra/spoke/plan.txt
            infra/spoke/plan.json
          if-no-files-found: warn

      - name: tofu apply
        if: inputs.mode != 'plan'
        run: tofu apply -input=false -no-color -auto-approve tfplan

      - name: Run traceability
        if: always()
        run: echo "spoke-vend mode='${{ inputs.mode }}' env_id='${{ inputs.env_id }}' spoke='${{ inputs.spoke_name }}' (cidr ${{ inputs.spoke_cidr }}) into ${{ inputs.target_subscription_id }} / ${{ inputs.region }} at commit ${{ github.sha }}." >> "$GITHUB_STEP_SUMMARY"
