name: iac-apply

# Merge rails (contracts/ci-workflows.md): on push to main, re-plan fresh and apply that
# plan (the PR plan is advisory — clarification Q3). Applies are serialized per stack and
# never auto-retried/reverted (FR-016). A failed apply leaves a red run (owner notified by
# GitHub); push-triggered applies are then blocked by the guard until the fix-forward PR
# is merged and the owner re-runs this workflow manually (workflow_dispatch).
#
# THREE PHASES, because of cross-stack ordering dependencies:
#   * Phase 1 (job `apply`): foundations + platform-dns + platform-observability apply in parallel. None
#     depends on another stack. platform-dns creates the platform-shared Private DNS zones;
#     platform-observability creates the platform-shared Log Analytics workspace. Both are referenced by
#     data source from later stacks (DNS links; diagnostic_settings), so they must exist first.
#   * Phase 2 (job `apply-dependent`): control-plane + fabric, which `needs` Phase 1. BOTH read
#     a platform-shared Private DNS zone via `data "azurerm_private_dns_zone"` at plan time
#     (control-plane → privatelink.postgres for its VNet-integrated server; fabric → the hub
#     zone links), so the zones MUST already exist. Running them parallel to platform-dns raced
#     the data lookup and failed; gating them behind Phase 1 removes the race.
#   * Phase 3 (job `apply-host`, spec 007): control-plane-host, which `needs` Phase 2. It reads
#     control-plane's ACA subnet + the private Postgres via data sources at plan time, so the
#     control-plane stack (incl. the snet-pdp-westus3-aca subnet) MUST be applied first. On first
#     bring-up the subnet lands in a PRIOR merge (the data source can't resolve a subnet that has
#     never been applied) — see infra/control-plane-host/README.md.

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".opentofu-version"
      - ".github/workflows/iac-apply.yml"
  workflow_dispatch:   # manual re-run — the acknowledged resolution after a failed apply

permissions:
  contents: read
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # Phase 1 — stacks with no cross-stack dependency. platform-dns publishes the shared Private DNS zones;
  # platform-observability publishes the shared Log Analytics workspace. Both must exist before the later
  # stacks that reference them by data source (Phase 2/3 diagnostic_settings + DNS links).
  # ---------------------------------------------------------------------------
  apply:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [foundations, platform-dns, platform-observability]
    concurrency:
      group: tofu-${{ matrix.stack }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v5

      # FR-016 guard: if the most recent completed run of this workflow failed, block
      # push-triggered runs. Resolution = merge the fix-forward PR, then trigger this workflow
      # manually (workflow_dispatch), which bypasses the guard. Lives in Phase 1 only: Phase 2
      # `needs` Phase 1, so a blocked Phase 1 also stops the dependent stacks; a manual dispatch
      # skips this step and both phases run.
      - name: Failed-state guard
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --workflow "${{ github.workflow }}" --branch main \
            --status completed --limit 1 --json conclusion --jq '.[0].conclusion // ""')
          if [ "$last" = "failure" ]; then
            echo "::error::Previous apply run failed. Push-triggered applies are blocked (FR-016). Merge the fix-forward PR, then re-run this workflow manually (Run workflow / workflow_dispatch) to clear it."
            exit 1
          fi

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: tofu init
        run: tofu init -input=false

      - name: tofu plan
        run: tofu plan -input=false -no-color -out=tfplan | tee "$GITHUB_STEP_SUMMARY"

      - name: tofu apply
        run: tofu apply -input=false -no-color -auto-approve tfplan

      - name: Run traceability
        if: always()
        run: |
          echo "Applied stack '${{ matrix.stack }}' at commit: ${{ github.sha }} (event: ${{ github.event_name }})" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Phase 2 — stacks that read platform-dns zones at plan time. Gated on Phase 1 so the zones
  # exist first. If any Phase 1 stack fails, this whole phase is skipped.
  # ---------------------------------------------------------------------------
  apply-dependent:
    needs: apply
    strategy:
      fail-fast: false
      matrix:
        stack: [control-plane, fabric]
    concurrency:
      group: tofu-${{ matrix.stack }}   # fabric shares its group with fabric-destroy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: tofu init
        run: tofu init -input=false

      - name: tofu plan
        run: tofu plan -input=false -no-color -out=tfplan | tee "$GITHUB_STEP_SUMMARY"

      - name: tofu apply
        run: tofu apply -input=false -no-color -auto-approve tfplan

      - name: Run traceability
        if: always()
        run: |
          echo "Applied stack '${{ matrix.stack }}' at commit: ${{ github.sha }} (event: ${{ github.event_name }})" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Phase 3 (spec 007) — control-plane-host. Gated on Phase 2: it reads control-plane's ACA subnet
  # + the private Postgres via data sources at plan time, so control-plane must be applied first.
  # ---------------------------------------------------------------------------
  apply-host:
    needs: apply-dependent
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [control-plane-host]
    concurrency:
      group: tofu-${{ matrix.stack }}   # shares its group with controlplane-host-destroy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: tofu init
        run: tofu init -input=false

      - name: tofu plan
        run: tofu plan -input=false -no-color -out=tfplan | tee "$GITHUB_STEP_SUMMARY"

      - name: tofu apply
        run: tofu apply -input=false -no-color -auto-approve tfplan

      - name: Run traceability
        if: always()
        run: |
          echo "Applied stack '${{ matrix.stack }}' at commit: ${{ github.sha }} (event: ${{ github.event_name }})" >> "$GITHUB_STEP_SUMMARY"

  # Failure hook (repo convention — see .github/actions/notify-sre-agent/README.md): on any
  # job failure, POST run context (failed jobs/steps, error annotations, log tails) to the
  # Azure SRE Agent HTTP trigger so the agent starts investigating without an owner in the
  # loop. Best-effort: it never fails this run; skipped entirely when the
  # SRE_AGENT_TRIGGER_URL repo variable is unset.
  notify-sre-agent:
    needs: [apply, apply-dependent, apply-host]
    if: ${{ failure() && vars.SRE_AGENT_TRIGGER_URL != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout (the local composite action)
      id-token: write  # azure/login OIDC → bearer token for the trigger
      actions: read    # this run's jobs + logs (failure context)
      checks: read     # per-job error annotations
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/notify-sre-agent
        with:
          trigger-url: ${{ vars.SRE_AGENT_TRIGGER_URL }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
