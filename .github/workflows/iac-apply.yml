name: iac-apply

# Merge rails (contracts/ci-workflows.md): on push to main, re-plan fresh and apply that
# plan (the PR plan is advisory — clarification Q3). Applies are serialized per stack and
# never auto-retried/reverted (FR-016). A failed apply leaves a red run (owner notified by
# GitHub); push-triggered applies are then blocked by the guard until the fix-forward PR
# is merged and the owner re-runs this workflow manually (workflow_dispatch).
#
# TWO PHASES, because of a cross-stack ordering dependency:
#   * Phase 1 (job `apply`): the independent stacks — foundations, control-plane, platform-dns —
#     apply in parallel, each in its own concurrency group (unrelated stacks never serialize).
#   * Phase 2 (job `apply-fabric`): the fabric stack, which `needs` Phase 1. The fabric reads the
#     platform-shared Private DNS zones via `data "azurerm_private_dns_zone"` (hub→zone links),
#     so those zones MUST already exist — i.e. `platform-dns` must have applied first. A single
#     parallel matrix raced fabric against platform-dns and failed fabric's data lookup; gating
#     fabric behind Phase 1 removes the race. (Spokes etc. that depend on fabric land in later
#     specs and would extend Phase 2 / add a Phase 3.)

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".opentofu-version"
      - ".github/workflows/iac-apply.yml"
  workflow_dispatch:   # manual re-run — the acknowledged resolution after a failed apply

permissions:
  contents: read
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # Phase 1 — independent stacks, applied in parallel.
  # ---------------------------------------------------------------------------
  apply:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [foundations, control-plane, platform-dns]
    # Serialize applies per stack; never cancel an in-flight apply (FR-016). Job-level so the
    # matrix value can key the group — top-level concurrency can't see matrix context.
    concurrency:
      group: tofu-${{ matrix.stack }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v5

      # FR-016 guard: if the most recent completed run of this workflow failed, block
      # push-triggered runs (conservative/workflow-wide with the matrix). Resolution = merge
      # the fix-forward PR, then trigger this workflow manually (workflow_dispatch), which
      # bypasses the guard. Lives in Phase 1 only: Phase 2 `needs` Phase 1, so a blocked Phase 1
      # also stops fabric; a manual dispatch skips this step and both phases run.
      - name: Failed-state guard
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --workflow "${{ github.workflow }}" --branch main \
            --status completed --limit 1 --json conclusion --jq '.[0].conclusion // ""')
          if [ "$last" = "failure" ]; then
            echo "::error::Previous apply run failed. Push-triggered applies are blocked (FR-016). Merge the fix-forward PR, then re-run this workflow manually (Run workflow / workflow_dispatch) to clear it."
            exit 1
          fi

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: tofu init
        run: tofu init -input=false

      # Re-plan fresh, then apply exactly that plan (clarification Q3).
      - name: tofu plan
        run: tofu plan -input=false -no-color -out=tfplan | tee "$GITHUB_STEP_SUMMARY"

      - name: tofu apply
        run: tofu apply -input=false -no-color -auto-approve tfplan

      - name: Run traceability
        if: always()
        run: |
          echo "Applied stack '${{ matrix.stack }}' at commit: ${{ github.sha }} (event: ${{ github.event_name }})" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Phase 2 — fabric. Gated on Phase 1 so the platform-dns zones the fabric links to exist
  # before its `data` lookups run. If any Phase 1 stack fails, this job is skipped (fabric is
  # never applied against an incomplete platform).
  # ---------------------------------------------------------------------------
  apply-fabric:
    needs: apply
    runs-on: ubuntu-latest
    concurrency:
      group: tofu-fabric   # shares the lock with fabric-destroy — no apply during a destroy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/fabric
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: tofu init
        run: tofu init -input=false

      - name: tofu plan
        run: tofu plan -input=false -no-color -out=tfplan | tee "$GITHUB_STEP_SUMMARY"

      - name: tofu apply
        run: tofu apply -input=false -no-color -auto-approve tfplan

      - name: Run traceability
        if: always()
        run: |
          echo "Applied stack 'fabric' at commit: ${{ github.sha }} (event: ${{ github.event_name }})" >> "$GITHUB_STEP_SUMMARY"
